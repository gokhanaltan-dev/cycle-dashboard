name: Daily update

on:
  schedule:
    # 22:15 UTC, Monday–Friday: after the US close in both summer and winter time
    - cron: "15 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Build dashboard
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional
        run: python -m cycle.build

      - name: Save the call log
        run: |
          git config user.name "cycle-dashboard-bot"
          git config user.email "cycle-dashboard-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Daily update $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
